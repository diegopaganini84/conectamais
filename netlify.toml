# Site estático: não precisa de build.
[build]
  publish = "."

# O conteúdo editado no painel precisa aparecer logo após cada publicação.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
